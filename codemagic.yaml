workflows:
  android-release:
    name: Android APK Build
    working_directory: my_app
    instance_type: mac_mini_m1
    environment:
      flutter: 3.22.3
    scripts:
      - name: Upgrade Android + Dependencies
        script: |
          flutter create .
          flutter pub upgrade
      - flutter clean
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk