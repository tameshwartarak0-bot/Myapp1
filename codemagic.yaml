workflows:
  android-release:
    name: Android APK Build
    working_directory: my_app
    environment:
      flutter: 3.3.4
    scripts:
      - flutter clean
      - rm -rf android/.gradle
      - rm rf -/ .pub-cach
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk