workflows:
  android-release:
    name: Android APK Build
    working_directory: my_app
    instance_type: mac_mini_m1
    environment:
      flutter: 3.19.6  # <-- YE LINE SABSE IMPORTANT HAI
      xcode: 15.2
    scripts:
      - flutter clean
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk