workflows:
  android-release:
    name: Android APK Build
    working_directory: my_app
    environment:
      flutter: 3.22.2  # <-- 3.19.6
    scripts:
            - flutter clean
            - flutter pub get
            - flutter build apk --release
    artifacts:
            - build/app/outputs/flutter-apk/*.apk  # <-- YE EK HI LINE ME HO